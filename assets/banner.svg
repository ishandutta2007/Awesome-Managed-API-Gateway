<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-subtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 22px;
      fill: #94a3b8;
      letter-spacing: 0px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }
    
    /* Dynamic Animations */
    @keyframes pulse-line {
      0% { stroke-dashoffset: 1000; opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { stroke-dashoffset: 0; opacity: 0.2; }
    }
    @keyframes float-node {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes spin-ring {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .animated-wire {
      stroke-dasharray: 20 10;
      animation: pulse-line 12s linear infinite;
    }
    .node-1 { animation: float-node 5s ease-in-out infinite; }
    .node-2 { animation: float-node 6s ease-in-out infinite 1s; }
    .node-3 { animation: float-node 7s ease-in-out infinite 2s; }
    .spinning-gear { transform-origin: 1000px 160px; animation: spin-ring 25s linear infinite; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />

  <!-- Background Tech Grid / Mesh Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="800" y1="0" x2="800" y2="320" />
    <line x1="1000" y1="0" x2="1000" y2="320" />
  </g>

  <!-- Dynamic Gateway Data Flow Lines (Background Dynamic Element) -->
  <g fill="none" stroke-width="2">
    <path d="M 100,260 Q 300,300 500,260 T 900,260" stroke="url(#cyan-grad)" opacity="0.3" class="animated-wire" />
    <path d="M 50,50 Q 350,10 650,50 T 1150,50" stroke="url(#primary-grad)" opacity="0.25" class="animated-wire" />
  </g>

  <!-- Decorative Abstract Geometric Graphic (Right Side Background) -->
  <g class="spinning-gear" opacity="0.15">
    <circle cx="1000" cy="160" r="110" stroke="url(#primary-grad)" stroke-width="2" fill="none" stroke-dasharray="12 6" />
    <circle cx="1000" cy="160" r="85" stroke="#38bdf8" stroke-width="1.5" fill="none" />
  </g>

  <!-- Dynamic Animated Microservice Nodes (Positioned safely away/behind clear text contrast) -->
  <g class="node-1" opacity="0.7">
    <circle cx="980" cy="110" r="6" fill="#38bdf8" filter="url(#glow)" />
    <line x1="980" y1="110" x2="1060" y2="150" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" />
  </g>
  <g class="node-2" opacity="0.7">
    <circle cx="1060" cy="150" r="8" fill="#a855f7" filter="url(#glow)" />
    <line x1="1060" y1="150" x2="990" y2="210" stroke="#a855f7" stroke-width="1" stroke-dasharray="4 4" />
  </g>
  <g class="node-3" opacity="0.7">
    <circle cx="990" cy="210" r="5" fill="#ec4899" filter="url(#glow)" />
  </g>

  <!-- Foreground Content Container (Ensures 100% visibility & readability) -->
  <!-- Top Pill / Badge -->
  <g transform="translate(80, 52)">
    <rect width="260" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="18" cy="15" r="4" fill="#10b981" filter="url(#glow-subtle)" />
    <text x="32" y="20" class="badge-text">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="142" class="title" filter="url(#glow-subtle)">Awesome Managed API Gateway</text>

  <!-- Gradient Underline Accent for Title -->
  <rect x="80" y="160" width="480" height="4" rx="2" fill="url(#primary-grad)" />

  <!-- Subtitle -->
  <text x="80" y="205" class="subtitle">Cloud API Gateways • Enterprise API Management • High-Performance OSS Proxies</text>

  <!-- Feature Pills / Chips (Foreground Bottom) -->
  <g transform="translate(80, 238)">
    <!-- Pill 1 -->
    <g transform="translate(0,0)">
      <rect width="140" height="28" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="14" y="18" fill="#cbd5e1" font-family="system-ui" font-size="12" font-weight="600">⚡ SaaS Pricing</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(152,0)">
      <rect width="165" height="28" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="14" y="18" fill="#cbd5e1" font-family="system-ui" font-size="12" font-weight="600">📊 Market Valuation</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(329,0)">
      <rect width="155" height="28" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="14" y="18" fill="#cbd5e1" font-family="system-ui" font-size="12" font-weight="600">⭐ OSS Star Ranks</text>
    </g>
  </g>
</svg>
